# =====================================================================
# 42X Academy LMS backend — shared settings.
# Secrets are NOT stored here. They come from environment variables
# (production) or backend/application-local.properties (local, git-ignored).
# =====================================================================

spring.application.name=lms-backend
server.port=${PORT:8080}
server.servlet.context-path=/api

# Local overrides (JWT secret, demo passwords)
spring.config.import=optional:file:./application-local.properties

# ---------- Azure SQL (Microsoft Entra sign-in, no database password) ----------
# Tokens come from AzureSqlTokenCallback. Env AZURE_SQL_AUTH: interactive (default, one browser
# sign-in per start), managed-identity (deployed on Azure) or default (Azure CLI / environment).
azure.sql.server=${AZURE_SQL_SERVER:42xcore.database.windows.net}
azure.sql.database=${AZURE_SQL_DATABASE:42X_Core}
spring.datasource.url=jdbc:sqlserver://${azure.sql.server}:1433;databaseName=${azure.sql.database};encrypt=true;trustServerCertificate=false;hostNameInCertificate=*.database.windows.net;loginTimeout=30;accessTokenCallbackClass=com.academy42x.lms.config.AzureSqlTokenCallback
# Leaves time for the browser sign-in and for a paused serverless database to wake up
spring.datasource.hikari.connection-timeout=120000

# ---------- JPA / Hibernate ----------
# Flyway owns the schema; Hibernate only checks that entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
spring.jpa.properties.hibernate.use_nationalized_character_data=true

# ---------- Flyway (SQL lives in ../database/azure-sql) ----------
# db/migration = schema (always). db/seed = sample data (remove in production).
spring.flyway.locations=${FLYWAY_LOCATIONS:classpath:db/migration,classpath:db/seed}
spring.flyway.clean-disabled=true

# ---------- Security ----------
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:480}
app.jwt.issuer=42x-lms

# Key for the encrypted student-password copies shown to admins (Students → View).
# Empty = feature off. Keep it secret; changing it makes existing copies unreadable.
app.password-vault.key=${PASSWORD_VAULT_KEY:}

# Frontend origins allowed to call the API (comma separated)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}

# Demo passwords for seeded users (local only; keep empty in production)
app.seed.student-password=${SEED_STUDENT_PASSWORD:}
app.seed.admin-password=${SEED_ADMIN_PASSWORD:}

# ---------- Health check (/api/actuator/health) ----------
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
